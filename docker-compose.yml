# Local development database only. Not a production deployment.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: edge
      POSTGRES_PASSWORD: edge
      POSTGRES_DB: edge_dev
    ports:
      - "5432:5432"
    volumes:
      - edge_pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  edge_pgdata:
